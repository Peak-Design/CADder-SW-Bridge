# Validates the manifest contract: the JSON Schema itself and the golden
# examples against it. The consumer-side parser test runs in the
# STEPper_NEXT repo, next to the parser; the SolidWorks half has no CI at
# all (hosted runners have no SolidWorks interops — see RELEASING.md).
name: schema

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - name: Validate golden examples against the schema
        run: |
          python - <<'PY'
          import json, glob, sys
          from jsonschema import Draft202012Validator

          with open("schema/rig-manifest.schema.json", encoding="utf-8") as f:
              schema = json.load(f)
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)

          failed = False
          for path in sorted(glob.glob("schema/examples/*.rig.json")):
              with open(path, encoding="utf-8") as f:
                  doc = json.load(f)
              errors = sorted(validator.iter_errors(doc), key=lambda e: list(e.path))
              for e in errors:
                  print(f"{path}: {'/'.join(map(str, e.path))}: {e.message}")
                  failed = True
              if not errors:
                  print(f"{path}: OK")
          sys.exit(1 if failed else 0)
          PY
